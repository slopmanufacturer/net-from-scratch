name: checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  steps:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Summary logic
        run: python tools/test_check.py
      - name: Every step
        run: python tools/check.py
